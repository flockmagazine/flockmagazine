<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — ISSUE 01</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  background: #111;
  overflow: hidden;
  font-family: 'IBM Plex Mono', monospace;
}

/* VIEWER */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* PAGE LAYOUT */

.page-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  width: 100%;
  height: 100%;
}

/* PAGES */

.page {
  max-height: 94vh;
  max-width: 94vw;
  object-fit: contain;
  box-shadow: 0 0 30px rgba(0,0,0,0.35);
}

/* DESKTOP DOUBLE SPREAD */

.double .page {
  max-width: 47vw;
}

/* NAVIGATION */

.controls {
  position: fixed;
  bottom: 24px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 14px;
  z-index: 999;
}

button {
  background: rgba(255,255,255,0.92);
  border: none;
  padding: 14px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  transition: opacity 0.2s ease;
}

button:hover {
  opacity: 0.8;
}

/* PAGE COUNTER */

.counter {
  position: fixed;
  top: 20px;
  right: 20px;
  color: rgba(255,255,255,0.8);
  font-size: 13px;
  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 900px) {

  body {
    overflow: hidden;
  }

  .page {
    max-width: 100vw;
    max-height: 100vh;
  }

  .double .page {
    max-width: 100vw;
  }

}

</style>
</head>

<body>

<div class="counter" id="counter"></div>

<div class="viewer">
  <div id="pages" class="page-container"></div>
</div>

<div class="controls">
  <button onclick="prevPage()">← PREV</button>
  <button onclick="nextPage()">NEXT →</button>
</div>

<script>

/* ======================================
   ADD YOUR PAGES HERE
====================================== */

const pages = [
  "pages/page-01.jpg",
  "pages/page-02.jpg",
  "pages/page-03.jpg",
  "pages/page-04.jpg",
  "pages/page-05.jpg",
  "pages/page-06.jpg",
  "pages/page-07.jpg",
  "pages/page-08.jpg"
];

/* ====================================== */

let current = 0;

function renderPages() {

  const container = document.getElementById("pages");
  const counter = document.getElementById("counter");

  container.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  counter.innerText = `${current + 1} / ${pages.length}`;

  /* MOBILE = SINGLE PAGE */

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    container.className = "page-container";

    container.appendChild(img);

  }

  /* DESKTOP */

  else {

    /* COVER + BACK COVER */

    if (current === 0 || current === pages.length - 1) {

      const img = document.createElement("img");

      img.src = pages[current];
      img.className = "page";

      container.className = "page-container";

      container.appendChild(img);

    }

    /* DOUBLE SPREADS */

    else {

      container.className = "page-container double";

      const left = document.createElement("img");
      left.src = pages[current];
      left.className = "page";

      container.appendChild(left);

      if (pages[current + 1]) {

        const right = document.createElement("img");
        right.src = pages[current + 1];
        right.className = "page";

        container.appendChild(right);

      }

    }

  }

}

/* NEXT */

function nextPage() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    if (current < pages.length - 1) {
      current++;
    }

  }

  else {

    if (current === 0) {
      current = 1;
    }

    else if (current < pages.length - 2) {
      current += 2;
    }

  }

  renderPages();

}

/* PREV */

function prevPage() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    if (current > 0) {
      current--;
    }

  }

  else {

    if (current === 1) {
      current = 0;
    }

    else if (current > 1) {
      current -= 2;
    }

  }

  renderPages();

}

/* SWIPE SUPPORT */

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {

  touchEndX = e.changedTouches[0].screenX;

  if (touchEndX < touchStartX - 50) {
    nextPage();
  }

  if (touchEndX > touchStartX + 50) {
    prevPage();
  }

});

/* RESIZE */

window.addEventListener("resize", renderPages);

/* INITIAL LOAD */

renderPages();

</script>

</body>
</html>
