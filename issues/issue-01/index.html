<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: white;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: black;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  font-family: system-ui;
}

/* =========================
   BIG FLOCK TITLE (FIXED)
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-size: 90px; /* ~5x bigger than before */
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
  line-height: 0.8;
}

/* =========================
   VIEWER SCALE (for zoom)
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  transform-origin: center;
}

/* =========================
   BOOK
========================= */

.book {
  display: flex;
  gap: 0;
}

/* =========================
   PAGE
========================= */

.page {
  height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  background: white;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  user-select: none;
}

.page.left {
  border-radius: 0 10px 10px 0;
}

.page.right {
  border-radius: 10px 0 0 10px;
}

/* cover single page */
.cover {
  max-width: 70vw;
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
  opacity: 0.5;
}

.nav:hover { opacity: 1; }

#prev { left: 20px; }
#next { right: 20px; }

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 20px;
  right: 20px;
  color: var(--ui);
}

/* =========================
   ZOOM STATE
========================= */

.zoomed {
  cursor: grab;
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer" id="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   FIXED IMAGE PATHS
========================= */

const issuePath = "issues/issue-01/";

/* IMPORTANT: safer string-based loading */
const pages = Array.from({ length: 19 }, (_, i) =>
  issuePath + "page-" + String(i+1).padStart(2,'0') + ".jpg"
);

let current = 0;

/* =========================
   RENDER
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  counter.innerText = `${current + 1} / ${pages.length}`;

  /* COVER ONLY */
  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page cover";

    book.appendChild(img);
    return;
  }

  /* SPREADS */
  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page left";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page right";
    book.appendChild(right);
  }
}

/* =========================
   NAVIGATION (FIXED COVER LOGIC)
========================= */

function next() {

  if (current === 0) {
    current = 1;
  } else if (current < pages.length - 2) {
    current += 2;
  }

  render();
}

function prev() {

  if (current === 1) {
    current = 0;
  } else if (current > 1) {
    current -= 2;
  }

  render();
}

/* =========================
   PINCH + ZOOM (WORKING VERSION)
========================= */

let scale = 1;
let startDist = 0;

/* wheel zoom (desktop) */
window.addEventListener("wheel", e => {

  scale += e.deltaY * -0.0015;
  scale = Math.min(Math.max(1, scale), 3);

  document.getElementById("viewer").style.transform =
    `scale(${scale})`;

});

/* pinch zoom (mobile) */
function getDist(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

window.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    startDist = getDist(e.touches);
  }
});

window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = getDist(e.touches);
    const delta = newDist - startDist;

    scale += delta * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    document.getElementById("viewer").style.transform =
      `scale(${scale})`;

    startDist = newDist;
  }
});

/* =========================
   SWIPE
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* INIT */

render();

</script>

</body>
</html>
