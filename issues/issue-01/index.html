<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   FLOCK TITLE (MATCH HOMEPAGE STYLE)
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: clamp(50px, 10vw, 120px); /* responsive full width feel */
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
  text-align: center;
  width: 100%;
}

/* DESKTOP: back to original placement */
@media (min-width: 901px) {
  .brand {
    left: 18px;
    transform: none;
    font-size: 56px;
    width: auto;
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
}

/* BOOK */
.book {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* PAGE */
.page {
  height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  background: transparent;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transition: transform 0.25s ease, opacity 0.25s ease; /* animation */
}

/* MOBILE */
@media (max-width: 900px) {
  .page {
    max-width: 100vw;
    height: auto;
    max-height: 80vh;
    border-radius: 0;
  }
}

/* =========================
   NAV BUTTONS (DESKTOP ONLY)
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

/* COUNTER */
.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
}

/* =========================
   PAGE ANIMATION CLASS
========================= */

.flip {
  transform: scale(0.98);
  opacity: 0.5;
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer" id="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;
let scale = 1;

/* =========================
   RENDER
========================= */

function render(animate = false) {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  if (animate) {
    book.classList.add("flip");
    setTimeout(() => book.classList.remove("flip"), 200);
  }

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  counter.innerText =
    `${current+1}-${Math.min(current+2, pages.length)}/${pages.length}`;
}

/* =========================
   NAVIGATION
========================= */

function next() {
  if (scale > 1.1) return; // no swipe when zoomed

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current < pages.length - 1) current++;
  } else {
    if (current === 0) current = 1;
    else if (current < pages.length - 2) current += 2;
  }

  render(true);
}

function prev() {
  if (scale > 1.1) return;

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current > 0) current--;
  } else {
    if (current === 1) current = 0;
    else if (current > 1) current -= 2;
  }

  render(true);
}

/* =========================
   TAP LEFT / RIGHT (MOBILE)
========================= */

window.addEventListener("click", e => {

  if (window.innerWidth > 900) return;
  if (scale > 1.1) return;

  const x = e.clientX;
  const w = window.innerWidth;

  if (x > w * 0.6) next();
  else if (x < w * 0.4) prev();
});

/* =========================
   SWIPE
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {

  if (scale > 1.1) return;

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* =========================
   PINCH ZOOM (SIMPLE SAFE VERSION)
========================= */

function dist(t) {
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

let startDist = 0;

window.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    startDist = dist(e.touches);
  }
});

window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = dist(e.touches);

    scale += (newDist - startDist) * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    document.getElementById("viewer").style.transform =
      `scale(${scale})`;

    startDist = newDist;
  }
});

/* INIT */

render();

</script>

</body>
</html>
