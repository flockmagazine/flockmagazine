<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   FLOCK (FIXED FONT + BOLD + SIZE RULES)
========================= */

.brand {
  position: fixed;
  top: 12px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700; /* FIX: bold restored */
  font-size: 56px;  /* desktop base */
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

/* MOBILE: 3x bigger */
@media (max-width: 900px) {
  .brand {
    left: 50%;
    transform: translateX(-50%);
    font-size: 150px; /* ~3x bigger */
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none; /* IMPORTANT for iOS zoom */
}

/* BOOK */
.book {
  display: flex;
  align-items: center;
}

/* PAGE */
.page {
  height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  background: white;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* MOBILE PAGE */
@media (max-width: 900px) {
  .page {
    max-width: 100vw;
    border-radius: 0;
  }
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: var(--ui);
  background: none;
  border: none;
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

/* HIDE NAV ON MOBILE */
@media (max-width: 900px) {
  .nav { display: none; }
}

/* COUNTER */
.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
}

/* =========================
   ZOOM STATE (iOS STYLE)
========================= */

.zoomed {
  cursor: grab;
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer" id="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   RENDER (UNCHANGED LOGIC)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  const l = current + 1;
  const r = rightIndex + 1;

  counter.innerText = r <= pages.length
    ? `${l}-${r}/${pages.length}`
    : `${l}/${pages.length}`;
}

/* =========================
   NAVIGATION
========================= */

function next() {
  if (current === 0) current = 1;
  else if (current < pages.length - 2) current += 2;
  render();
}

function prev() {
  if (current === 1) current = 0;
  else if (current > 1) current -= 2;
  render();
}

/* =========================
   iOS STYLE PINCH ZOOM (PROPER)
========================= */

let scale = 1;
let startDist = 0;
let isZoomed = false;

const viewer = document.getElementById("viewer");

function dist(t) {
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

/* pinch start */
window.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    startDist = dist(e.touches);
    isZoomed = true;
  }
});

/* pinch move */
window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = dist(e.touches);

    scale += (newDist - startDist) * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    viewer.style.transform = `scale(${scale})`;

    startDist = newDist;
  }
});

/* =========================
   SWIPE (DISABLED WHEN ZOOMED)
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {

  if (scale > 1.1) return; // 🔥 IMPORTANT FIX

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* INIT */

render();

</script>

</body>
</html>
