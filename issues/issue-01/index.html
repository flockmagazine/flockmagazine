<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK Reader</title>

<style>

:root {
  --bg: #111;
  --ui: #ffffff;
  --ui-invert: #000000;
}

/* AUTO LIGHT MODE DETECTION */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000000;
    --ui-invert: #ffffff;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  font-family: system-ui;
}

/* =========================
   TOP LEFT BRAND BUTTON
========================= */

.brand {
  position: fixed;
  top: 18px;
  left: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  color: var(--ui);
  z-index: 9999;
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 2200px;
}

/* =========================
   BOOK
========================= */

.book {
  display: flex;
  transform-style: preserve-3d;
}

/* =========================
   PAGE BASE
========================= */

.page {
  height: 92vh;
  width: auto;
  max-width: 50vw;

  object-fit: contain;
  background: white;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);

  backface-visibility: hidden;

  /* 🔥 FIX BLUR / IMPROVE SHARPNESS */
  image-rendering: auto;
  transform: translateZ(0);
}

/* LEFT / RIGHT */

.page.left {
  border-radius: 0 10px 10px 0;
}

.page.right {
  border-radius: 10px 0 0 10px;
}

/* =========================
   COVER FIX (IMPORTANT)
========================= */

.cover-single {
  max-width: 70vw;
}

/* =========================
   SIDE NAV BUTTONS (DESKTOP)
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  font-size: 48px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.nav:hover {
  opacity: 1;
}

#prevBtn {
  left: 24px;
}

#nextBtn {
  right: 24px;
}

/* MOBILE NAV (bottom) */

@media (max-width: 900px) {

  #prevBtn, #nextBtn {
    top: auto;
    bottom: 18px;
    transform: none;
    font-size: 22px;
    background: rgba(0,0,0,0.15);
    padding: 10px 14px;
    border-radius: 999px;
  }

}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  color: var(--ui);
  font-size: 12px;
  letter-spacing: 1px;
}

/* =========================
   DRAG FEEL
========================= */

.dragging {
  cursor: grabbing;
}

.page.drag-left {
  transform: rotateY(-18deg);
}

.page.drag-right {
  transform: rotateY(18deg);
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prevBtn" onclick="prev()">‹</button>
<button class="nav" id="nextBtn" onclick="next()">›</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   ISSUE CONFIG
========================= */

const issuePath = "issues/issue-01/";

const pages = Array.from({ length: 19 }, (_, i) =>
  `${issuePath}page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   PRELOAD CACHE
========================= */

const cache = new Map();

function load(n) {
  if (cache.has(n)) return cache.get(n);

  const img = new Image();
  img.src = pages[n];
  cache.set(n, img);
  return img;
}

/* =========================
   RENDER (FIXED SPREAD LOGIC)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  counter.innerText = `${current + 1} / ${pages.length}`;

  /* =========================
     COVER HANDLING (FIXED)
  ========================= */

  if (current === 0) {

    const cover = load(0);
    cover.className = "page cover-single";
    book.appendChild(cover);

    load(1);
    load(2);
    return;
  }

  /* =========================
     SPREAD LOGIC (CORRECTED)
  ========================= */

  const leftIndex = current;
  const rightIndex = current + 1;

  const left = load(leftIndex);
  left.className = "page left";

  book.appendChild(left);

  if (rightIndex < pages.length) {
    const right = load(rightIndex);
    right.className = "page right";
    book.appendChild(right);
  }

  /* preload neighbors */
  load(current + 2);
  load(current - 2);

}

/* =========================
   NAVIGATION (SPREAD SAFE)
========================= */

function next() {
  if (current === 0) {
    current = 1;
  } else if (current < pages.length - 2) {
    current += 2;
  }
  render();
}

function prev() {
  if (current === 1) {
    current = 0;
  } else if (current > 1) {
    current -= 2;
  }
  render();
}

/* =========================
   DRAG FLIP (APPLE BOOKS FEEL)
========================= */

let startX = 0;
let dragging = false;

document.addEventListener("mousedown", e => {
  dragging = true;
  startX = e.clientX;
  document.body.classList.add("dragging");
});

document.addEventListener("mouseup", () => {
  dragging = false;
  document.body.classList.remove("dragging");
});

document.addEventListener("mousemove", e => {

  if (!dragging) return;

  const dx = e.clientX - startX;
  const pagesEl = document.querySelectorAll(".page");

  pagesEl.forEach(p => {
    p.style.transform = `rotateY(${dx * 0.05}deg)`;
  });

  if (dx < -80) {
    next();
    dragging = false;
  }

  if (dx > 80) {
    prev();
    dragging = false;
  }

});

/* =========================
   TOUCH SWIPE
========================= */

let tStart = 0;

document.addEventListener("touchstart", e => {
  tStart = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {

  const dx = e.changedTouches[0].clientX - tStart;

  if (dx < -40) next();
  if (dx > 40) prev();

});

/* =========================
   INIT
========================= */

render();

</script>

</body>
</html>
