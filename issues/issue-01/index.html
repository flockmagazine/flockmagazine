<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — ISSUE 01</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  background: #111;
  overflow: hidden;
  font-family: 'IBM Plex Mono', monospace;
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 2000px;
}

/* =========================
   PAGE WRAPPER
========================= */

.page-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  transform-style: preserve-3d;
}

/* =========================
   PAGE STYLE
========================= */

.page {
  max-height: 94vh;
  max-width: 48vw;
  object-fit: contain;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);

  transform-origin: left center;
  backface-visibility: hidden;

  transition: transform 0.6s ease, opacity 0.6s ease;
}

/* FLIP ANIMATION */

.page.flip-next-left {
  transform: rotateY(-80deg);
  opacity: 0.2;
}

.page.flip-next-right {
  transform: rotateY(80deg);
  opacity: 0.2;
}

/* SINGLE PAGE */

.single .page {
  max-width: 94vw;
}

/* =========================
   CONTROLS
========================= */

.controls {
  position: fixed;
  bottom: 24px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 14px;
  z-index: 999;
}

button {
  background: rgba(255,255,255,0.92);
  border: none;
  padding: 14px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
}

/* COUNTER */

.counter {
  position: fixed;
  top: 20px;
  right: 20px;
  color: rgba(255,255,255,0.8);
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 900px) {
  .page {
    max-width: 100vw;
  }
}

</style>
</head>

<body>

<div class="counter" id="counter"></div>

<div class="viewer">
  <div id="pages" class="page-container"></div>
</div>

<div class="controls">
  <button onclick="prevPage()">← PREV</button>
  <button onclick="nextPage()">NEXT →</button>
</div>

<script>

/* =========================
   AUTO LOAD 19 PAGES
========================= */

const pages = Array.from({length: 19}, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* optional sound hook */
const flipSound = new Audio();
flipSound.src = ""; // add "flip.mp3" if you want later

/* =========================
   RENDER
========================= */

function renderPages(direction = "next") {

  const container = document.getElementById("pages");
  const counter = document.getElementById("counter");

  container.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  counter.innerText = `${current + 1} / ${pages.length}`;

  const animateClass = direction === "next"
    ? "flip-next-left"
    : "flip-next-right";

  /* MOBILE: single page */
  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    container.className = "page-container single";
    container.appendChild(img);

    return;
  }

  /* DESKTOP: spreads */

  container.className = "page-container";

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page " + animateClass;

  container.appendChild(left);

  const rightIndex = current + 1;

  if (pages[rightIndex]) {

    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page " + animateClass;

    container.appendChild(right);
  }

  /* trigger animation reset */
  requestAnimationFrame(() => {
    document.querySelectorAll(".page").forEach(p => {
      p.classList.remove("flip-next-left", "flip-next-right");
    });
  });

}

/* =========================
   NAVIGATION
========================= */

function nextPage() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current < pages.length - 1) current++;
  } else {
    if (current < pages.length - 2) current += 2;
  }

  flipSound.play().catch(()=>{});
  renderPages("next");
}

function prevPage() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current > 0) current--;
  } else {
    if (current > 1) current -= 2;
    else current = 0;
  }

  flipSound.play().catch(()=>{});
  renderPages("prev");
}

/* =========================
   SWIPE
========================= */

let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (endX < startX - 40) nextPage();
  if (endX > startX + 40) prevPage();
});

/* resize */
window.addEventListener("resize", renderPages);

renderPages();

</script>

</body>
</html>
