<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   FLOCK TITLE
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

@media (max-width: 900px) {
  .brand {
    left: 50%;
    transform: translateX(-50%);
    font-size: 28vw;
    text-align: center;
    top: 6px;
    width: 100%;
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  padding-top: 22vw;
  box-sizing: border-box;

  touch-action: none;
}

/* BOOK */
.book {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* PAGE */
.page {
  height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

@media (max-width: 900px) {
  .page {
    max-width: 100vw;
    max-height: 78vh;
    height: auto;
    border-radius: 0;
  }
}

/* COUNTER */
.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
  z-index: 9999;
}

/* NAV */
.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer" id="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   ZOOM + PAN STATE
========================= */

let scale = 1;
let panX = 0;
let panY = 0;

let startDist = 0;
let startPanX = 0;
let startPanY = 0;
let isPanning = false;

const viewer = document.getElementById("viewer");

/* =========================
   APPLY TRANSFORM
========================= */

function applyTransform() {
  viewer.style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

/* =========================
   RENDER
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  const img = document.createElement("img");
  img.src = pages[current];
  img.className = "page";

  book.appendChild(img);

  counter.innerText = `${current+1}/${pages.length}`;
}

/* =========================
   NAV
========================= */

function next() {
  if (scale > 1.05) return;

  if (current < pages.length - 1) current++;
  render();
}

function prev() {
  if (scale > 1.05) return;

  if (current > 0) current--;
  render();
}

/* =========================
   TAP LEFT/RIGHT
========================= */

window.addEventListener("click", e => {

  if (window.innerWidth > 900) return;
  if (scale > 1.05) return;

  const x = e.clientX;
  const w = window.innerWidth;

  if (x > w * 0.6) next();
  else if (x < w * 0.4) prev();
});

/* =========================
   SWIPE
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;

  if (e.touches.length === 1 && scale > 1.05) {
    isPanning = true;
    startPanX = e.touches[0].clientX - panX;
    startPanY = e.touches[0].clientY - panY;
  }
});

window.addEventListener("touchend", e => {

  if (scale > 1.05) return;

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();

  isPanning = false;
});

/* =========================
   PINCH + PAN
========================= */

function dist(t) {
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = dist(e.touches);

    scale += (newDist - startDist) * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    startDist = newDist;
    applyTransform();
    return;
  }

  if (isPanning && e.touches.length === 1 && scale > 1.05) {

    panX = e.touches[0].clientX - startPanX;
    panY = e.touches[0].clientY - startPanY;

    applyTransform();
  }
});

/* INIT */

render();

</script>

</body>
</html>
