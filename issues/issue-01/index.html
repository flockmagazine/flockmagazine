<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   TOP BRAND (FIXED MOBILE CENTER)
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: clamp(40px, 5vw, 56px);
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

@media (max-width: 900px) {
  .brand {
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: clamp(70px, 12vw, 110px);
  }
}

/* =========================
   VIEWER (FIXES WHITE BARS)
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* IMPORTANT FIX: removes vertical gaps */
.book {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* =========================
   PAGE (FIX WHITE BARS COMPLETELY)
========================= */

.page {
  display: block;
  height: 92vh;
  width: auto;
  max-width: 48vw;

  object-fit: contain;
  background: transparent;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border-radius: 14px;
}

/* MOBILE: FULL CONTROLLED CENTERING */
@media (max-width: 900px) {

  .book {
    flex-direction: column;
    height: 100vh;
  }

  .page {
    max-width: 100vw;
    height: auto;
    max-height: 80vh; /* IMPORTANT: prevents overlap with title */
    margin-top: 70px;  /* pushes image below title */
    border-radius: 0;
  }
}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 16px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
}

/* =========================
   NAV (DESKTOP ONLY)
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES (SAFE PATHS)
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   RENDER (CLEAN + STABLE)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  /* =========================
     MOBILE: SINGLE PAGE ONLY
  ========================= */

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  /* =========================
     DESKTOP: SPREADS
  ========================= */

  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  const l = current + 1;
  const r = rightIndex + 1;

  counter.innerText = r <= pages.length
    ? `${l}-${r}/${pages.length}`
    : `${l}/${pages.length}`;
}

/* =========================
   NAVIGATION
========================= */

function next() {
  if (current === 0) current = 1;
  else if (current < pages.length - 2) current += 2;
  render();
}

function prev() {
  if (current === 1) current = 0;
  else if (current > 1) current -= 2;
  render();
}

/* INIT */

render();

</script>

</body>
</html>
