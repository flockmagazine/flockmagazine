<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   THEME
========================= */

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   FULLSCREEN BUTTONS
========================= */

.fs-btn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 99999;
  padding: 10px 14px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-family: system-ui;
}

#exitFs {
  display: none;
  right: 90px;
}

/* =========================
   DESKTOP VIEWER FIX (NO OVERFLOW)
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

/* BOOK */
.book {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================
   PAGE
========================= */

.page {
  max-height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  touch-action: none;
}

/* =========================
   MOBILE LAYOUT = HEADER + VIEWPORT
========================= */

@media (max-width: 900px) {

  body {
    overflow: hidden;
  }

  .viewer {
    flex-direction: column;
  }

  .book {
    height: calc(100vh - 70px);
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    max-width: 100vw;
    max-height: 78vh;
    border-radius: 0;
  }
}

/* =========================
   MOBILE HEADER (NO OVERLAP SYSTEM)
========================= */

.mobile-bar {
  display: none;
}

@media (max-width: 900px) {

  .mobile-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    padding: 12px 14px;
    z-index: 9999;

    font-family: "Teko", sans-serif;
    color: var(--ui);
  }

  .mobile-title {
    font-size: 26px;
    font-weight: 700;
  }

  .counter {
    font-family: system-ui;
    font-size: 14px;
  }
}

/* =========================
   DESKTOP COUNTER
========================= */

.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 9999;
  color: var(--ui);
  font-family: system-ui;
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

/* =========================
   ZOOM/PAN FIX
========================= */

.zoomed {
  cursor: grab;
}

</style>
</head>

<body>

<!-- MOBILE TOP BAR -->
<div class="mobile-bar">
  <div class="mobile-title">FLOCK</div>
  <div id="mobileCounter"></div>
</div>

<!-- DESKTOP COUNTER -->
<div class="counter" id="counter"></div>

<!-- FULLSCREEN BUTTONS -->
<button class="fs-btn" onclick="goFullscreen()">Fullscreen</button>
<button class="fs-btn" id="exitFs" onclick="exitFullscreen()">Exit</button>

<!-- NAV -->
<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   ZOOM + PAN STATE
========================= */

let scale = 1;
let panX = 0;
let panY = 0;

let startDist = 0;
let startPanX = 0;
let startPanY = 0;
let isPanning = false;

/* =========================
   ELEMENTS
========================= */

const viewer = document.getElementById("viewer");
const book = document.getElementById("book");

/* =========================
   RENDER
========================= */

function render() {

  book.innerHTML = "";

  const img = document.createElement("img");
  img.src = pages[current];
  img.className = "page";

  book.appendChild(img);

  document.getElementById("counter").innerText =
    `${current+1}/${pages.length}`;

  document.getElementById("mobileCounter").innerText =
    `${current+1}/${pages.length}`;
}

/* =========================
   NAV
========================= */

function next() {
  if (scale > 1.05) return;
  if (current < pages.length - 1) current++;
  render();
}

function prev() {
  if (scale > 1.05) return;
  if (current > 0) current--;
  render();
}

/* =========================
   FULLSCREEN
========================= */

function goFullscreen() {
  const el = document.documentElement;

  if (el.requestFullscreen) el.requestFullscreen();

  document.getElementById("exitFs").style.display = "block";
}

function exitFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();

  document.getElementById("exitFs").style.display = "none";
}

/* =========================
   DOUBLE TAP RESET (iOS FEEL)
========================= */

let lastTap = 0;

window.addEventListener("touchend", e => {

  const now = Date.now();

  if (now - lastTap < 300) {

    scale = 1;
    panX = 0;
    panY = 0;
    viewer.style.transform = "none";
  }

  lastTap = now;
});

/* =========================
   PINCH + PAN
========================= */

function dist(t) {
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

window.addEventListener("touchstart", e => {

  if (e.touches.length === 2) {
    startDist = dist(e.touches);
  }

  if (e.touches.length === 1 && scale > 1.05) {
    isPanning = true;
    startPanX = e.touches[0].clientX - panX;
    startPanY = e.touches[0].clientY - panY;
  }
});

window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = dist(e.touches);

    scale += (newDist - startDist) * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    startDist = newDist;

    apply();
    return;
  }

  if (isPanning && e.touches.length === 1 && scale > 1.05) {

    panX = e.touches[0].clientX - startPanX;
    panY = e.touches[0].clientY - startPanY;

    apply();
  }
});

window.addEventListener("touchend", () => {
  isPanning = false;
});

/* =========================
   DESKTOP SCROLL ZOOM + PAN FIX
========================= */

window.addEventListener("wheel", e => {

  if (e.ctrlKey) { // pinch zoom trackpad

    scale += -e.deltaY * 0.01;
    scale = Math.min(Math.max(1, scale), 4);

    apply();
  } else {

    viewer.scrollTop += e.deltaY;
    viewer.scrollLeft += e.deltaX;
  }
});

/* =========================
   APPLY TRANSFORM
========================= */

function apply() {
  viewer.style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

/* INIT */

render();

</script>

</body>
</html>
