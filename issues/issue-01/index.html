<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   THEME
========================= */

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   TITLE
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

/* hide ONLY in fullscreen (desktop fix) */
:fullscreen .brand {
  display: none;
}

/* MOBILE TITLE */
@media (max-width: 900px) {
  .brand {
    font-size: 18px;
    top: 12px;
    left: 12px;
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* BOOK */
.book {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  transform-origin: center center;
}

/* PAGE */
.page {
  max-height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* MOBILE */
@media (max-width: 900px) {

  .book {
    flex-direction: column;
  }

  .page {
    max-width: 100vw;
    max-height: calc(100vh - 90px);
    border-radius: 0;
  }
}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 14px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
  z-index: 9999;
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

/* =========================
   FULLSCREEN BUTTON
========================= */

.fs-btn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 99999;
  padding: 10px 14px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-family: system-ui;
}

@media (max-width: 900px) {
  .fs-btn { display: none; }
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()">Fullscreen</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   ZOOM / PAN (DESKTOP FULLSCREEN ONLY)
========================= */

let scale = 1;
let panX = 0;
let panY = 0;

/* =========================
   RENDER
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  // DESKTOP SPREAD LOGIC
  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page";
    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  counter.innerText =
    `${current+1}-${Math.min(current+2, pages.length)}/${pages.length}`;
}

/* =========================
   NAV
========================= */

function next() {
  if (current === 0) current = 1;
  else if (current < pages.length - 2) current += 2;
  resetZoom();
  render();
}

function prev() {
  if (current === 1) current = 0;
  else if (current > 1) current -= 2;
  resetZoom();
  render();
}

/* =========================
   FULLSCREEN TOGGLE
========================= */

function toggleFullscreen() {

  const btn = document.getElementById("fsBtn");

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    btn.innerText = "Exit Fullscreen";
  } else {
    document.exitFullscreen();
    btn.innerText = "Fullscreen";
  }
}

/* =========================
   RESET ZOOM
========================= */

function resetZoom() {
  scale = 1;
  panX = 0;
  panY = 0;
  applyTransform();
}

/* =========================
   APPLY TRANSFORM
========================= */

function applyTransform() {
  document.getElementById("book").style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

/* =========================
   DESKTOP FULLSCREEN ZOOM + PAN
========================= */

window.addEventListener("wheel", (e) => {

  if (!document.fullscreenElement) return;
  if (window.innerWidth <= 900) return;

  // ZOOM
  if (e.ctrlKey) {

    scale += -e.deltaY * 0.01;
    scale = Math.min(Math.max(1, scale), 4);

    applyTransform();
    return;
  }

  // PAN
  if (scale > 1) {
    panX -= e.deltaX;
    panY -= e.deltaY;
    applyTransform();
  }
});

/* =========================
   MOBILE SWIPE
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {

  if (window.innerWidth > 900) return;

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* =========================
   TAP NAV (MOBILE)
========================= */

window.addEventListener("click", e => {

  if (window.innerWidth > 900) return;

  const x = e.clientX;
  const w = window.innerWidth;

  if (x > w * 0.6) next();
  else if (x < w * 0.4) prev();
});

/* INIT */

render();

</script>

</body>
</html>
