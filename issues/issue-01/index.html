<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   TITLE
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

@media (max-width: 900px) {
  .brand {
    left: 50%;
    transform: translateX(-50%);
    font-size: 34vw;
    text-align: center;
    width: 100%;
    top: 6px;
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.book {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

.page {
  max-height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* MOBILE = SINGLE PAGE ONLY */
@media (max-width: 900px) {

  .book {
    flex-direction: column;
  }

  .page {
    max-width: 100vw;
    max-height: 78vh;
    border-radius: 0;
  }
}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 18px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
  z-index: 9999;
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

/* =========================
   FULLSCREEN BUTTONS (DESKTOP ONLY)
========================= */

.fs-btn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 99999;
  padding: 10px 14px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-family: system-ui;
}

#exitFs {
  display: none;
  right: 130px;
}

/* 🚫 REMOVE ON MOBILE */
@media (max-width: 900px) {
  .fs-btn {
    display: none;
  }
  .nav { display: none; }
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<!-- DESKTOP ONLY BUTTONS -->
<button class="fs-btn" onclick="goFullscreen()">Fullscreen</button>
<button class="fs-btn" id="exitFs" onclick="exitFullscreen()">Exit</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   RENDER (FIXED SPREAD LOGIC)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";
    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  // DESKTOP SPREADS
  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  counter.innerText =
    `${current+1}-${Math.min(current+2, pages.length)}/${pages.length}`;
}

/* =========================
   NAV
========================= */

function next() {
  if (current < pages.length - 2) current += 2;
  render();
}

function prev() {
  if (current > 0) current -= 2;
  render();
}

/* =========================
   FULLSCREEN (DESKTOP ONLY)
========================= */

function goFullscreen() {
  document.documentElement.requestFullscreen();
  document.getElementById("exitFs").style.display = "block";
}

function exitFullscreen() {
  document.exitFullscreen();
  document.getElementById("exitFs").style.display = "none";
}

/* INIT */

render();

</script>

</body>
</html>
