<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   MAGAZINE FRAME (ROUNDED)
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* IMPORTANT: removes white bars */
.book {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  height: 100%;
}

/* =========================
   PAGE STYLE (NO WHITE BARS FIX)
========================= */

.page {
  display: block;
  height: 94vh;
  width: auto;
  max-width: 48vw;

  object-fit: contain;
  background: transparent;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);

  border-radius: 14px; /* rounded corners */
}

/* =========================
   COVER SINGLE PAGE
========================= */

.cover {
  max-width: 70vw;
}

/* =========================
   TOP FLOCK BUTTON
========================= */

.brand {
  position: fixed;
  top: 12px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-size: 50px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 16px;
  right: 18px;
  font-family: system-ui;
  color: var(--ui);
}

/* =========================
   NAV (DESKTOP ONLY)
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
}

.nav:hover { opacity: 1; }

#prev { left: 20px; }
#next { right: 20px; }

/* =========================
   MOBILE OVERRIDES
========================= */

@media (max-width: 900px) {

  .brand {
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .nav {
    display: none; /* remove side buttons */
  }

  .page {
    max-width: 100vw;
    height: 92vh;
    border-radius: 0; /* cleaner mobile feel */
  }

  .book {
    flex-direction: column;
  }

}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   RENDER (FIXED MOBILE + DESKTOP LOGIC)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  /* =========================
     MOBILE: SINGLE PAGE ONLY
  ========================= */

  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page cover";

    book.appendChild(img);

    counter.innerText = `${current + 1}/${pages.length}`;
    return;
  }

  /* =========================
     DESKTOP: SPREADS
  ========================= */

  const isCover = current === 0;

  if (isCover) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page cover";

    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";

  book.appendChild(left);

  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";

    book.appendChild(right);
  }

  /* =========================
     COUNTER FIX (X-X/19)
  ========================= */

  const leftPage = current + 1;
  const rightPage = rightIndex < pages.length ? rightIndex + 1 : "";

  if (rightPage) {
    counter.innerText = `${leftPage}-${rightPage}/${pages.length}`;
  } else {
    counter.innerText = `${leftPage}/${pages.length}`;
  }
}

/* =========================
   NAVIGATION
========================= */

function next() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current < pages.length - 1) current++;
  } else {
    if (current === 0) current = 1;
    else if (current < pages.length - 2) current += 2;
  }

  render();
}

function prev() {

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current > 0) current--;
  } else {
    if (current === 1) current = 0;
    else if (current > 1) current -= 2;
  }

  render();
}

/* =========================
   SWIPE (MOBILE ONLY)
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

window.addEventListener("touchend", e => {

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* INIT */

render();

</script>

</body>
</html>
