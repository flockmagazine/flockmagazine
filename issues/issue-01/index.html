<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK — Issue 01</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   THEME
========================= */

:root {
  --bg: #111;
  --ui: #fff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f1ea;
    --ui: #000;
  }
}

body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
}

/* =========================
   TITLE
========================= */

.brand {
  position: fixed;
  top: 10px;
  left: 18px;
  font-family: "Teko", sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: var(--ui);
  cursor: pointer;
  z-index: 9999;
}

/* MOBILE TITLE (kept stable) */
@media (max-width: 900px) {
  .brand {
    font-size: 36px;
    top: 12px;
    left: 12px;
    line-height: 1;
  }
}

/* =========================
   VIEWER
========================= */

.viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.book {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  transform-origin: center center;
}

/* PAGE */
.page {
  max-height: 92vh;
  max-width: 48vw;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* MOBILE */
@media (max-width: 900px) {

  .book {
    flex-direction: column;
  }

  .page {
    max-width: 100vw;
    max-height: calc(100vh - 90px);
    border-radius: 0;
  }
}

/* =========================
   COUNTER
========================= */

.counter {
  position: fixed;
  top: 12px;
  right: 18px;
  color: var(--ui);
  font-family: system-ui;
  z-index: 9999;
}

/* =========================
   NAV
========================= */

.nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  background: none;
  border: none;
  color: var(--ui);
  cursor: pointer;
  opacity: 0.6;
  z-index: 9999;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 900px) {
  .nav { display: none; }
}

</style>
</head>

<body>

<div class="brand" onclick="location.href='../../index.html'">FLOCK</div>

<div class="counter" id="counter"></div>

<button class="nav" id="prev" onclick="prev()">‹</button>
<button class="nav" id="next" onclick="next()">›</button>

<div class="viewer">
  <div class="book" id="book"></div>
</div>

<script>

/* =========================
   PAGES
========================= */

const pages = Array.from({ length: 19 }, (_, i) =>
  `page-${String(i+1).padStart(2,'0')}.jpg`
);

let current = 0;

/* =========================
   ZOOM STATE (mobile-safe, unused on desktop logic)
========================= */

let scale = 1;
let panX = 0;
let panY = 0;
let isZooming = false;

/* =========================
   RENDER (FIXED ARCHITECTURE)
========================= */

function render() {

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");

  book.innerHTML = "";

  const mobile = window.innerWidth <= 900;

  /* =========================
     📱 MOBILE = LINEAR 1–19
  ========================= */
  if (mobile) {

    const img = document.createElement("img");
    img.src = pages[current];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `${current+1}/${pages.length}`;
    return;
  }

  /* =========================
     🖥 DESKTOP = COVER + SPREADS
  ========================= */

  // Cover page (single)
  if (current === 0) {

    const img = document.createElement("img");
    img.src = pages[0];
    img.className = "page";

    book.appendChild(img);

    counter.innerText = `1/${pages.length}`;
    return;
  }

  // Left page
  const left = document.createElement("img");
  left.src = pages[current];
  left.className = "page";
  book.appendChild(left);

  // Right page
  const rightIndex = current + 1;

  if (rightIndex < pages.length) {
    const right = document.createElement("img");
    right.src = pages[rightIndex];
    right.className = "page";
    book.appendChild(right);
  }

  counter.innerText =
    `${current+1}-${Math.min(current+2, pages.length)}/${pages.length}`;
}

/* =========================
   NAVIGATION (FIXED MOBILE + DESKTOP)
========================= */

function next() {

  if (isZooming) return;

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current < pages.length - 1) current += 1;
    render();
    return;
  }

  if (current === 0) current = 1;
  else if (current < pages.length - 2) current += 2;

  resetZoom();
  render();
}

function prev() {

  if (isZooming) return;

  const mobile = window.innerWidth <= 900;

  if (mobile) {
    if (current > 0) current -= 1;
    render();
    return;
  }

  if (current === 1) current = 0;
  else if (current > 1) current -= 2;

  resetZoom();
  render();
}

/* =========================
   ZOOM RESET
========================= */

function resetZoom() {
  scale = 1;
  panX = 0;
  panY = 0;
  apply();
}

function apply() {
  document.getElementById("book").style.transform =
    `translate(${panX}px, ${panY}px) scale(${scale})`;
}

/* =========================
   MOBILE SWIPE (SAFE)
========================= */

let startX = 0;

window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  isZooming = scale > 1.05;
});

window.addEventListener("touchend", e => {

  if (isZooming) return;
  if (window.innerWidth > 900) return;

  const dx = e.changedTouches[0].clientX - startX;

  if (dx < -50) next();
  if (dx > 50) prev();
});

/* TAP NAV */
window.addEventListener("click", e => {

  if (isZooming) return;
  if (window.innerWidth > 900) return;

  const x = e.clientX;
  const w = window.innerWidth;

  if (x > w * 0.6) next();
  else if (x < w * 0.4) prev();
});

/* =========================
   PINCH ZOOM (MOBILE ONLY SAFE)
========================= */

function dist(t) {
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

let startDist = 0;

window.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    startDist = dist(e.touches);
    isZooming = true;
  }
});

window.addEventListener("touchmove", e => {

  if (e.touches.length === 2) {

    const newDist = dist(e.touches);

    scale += (newDist - startDist) * 0.005;
    scale = Math.min(Math.max(1, scale), 3);

    startDist = newDist;

    apply();
  }
});

window.addEventListener("touchend", () => {
  setTimeout(() => {
    if (scale <= 1.05) isZooming = false;
  }, 120);
});

/* INIT */
render();

</script>

</body>
</html>
