<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  padding: 40px 20px;
  background: #f4f1ea;
  font-family: Arial;
}

/* TITLE */
h1 {
  text-align: center;
  font-family: "Teko", sans-serif;
  font-size: 200px;
  margin: 0;
  line-height: 0.9;
}

/* SUBTITLE (FIXED — BIG AGAIN) */
.subtitle {
  text-align: center;
  font-family: "IBM Plex Mono", monospace;
  font-size: 28px;   /* FIX */
  margin: 10px auto 50px;
  max-width: 100%;
  letter-spacing: 2px;
  color: #666;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  max-width: 420px;
  margin: auto;
  gap: 20px;
}

/* ISSUE CARD */
.issue {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  transition: 0.25s ease;
}

.issue:hover {
  transform: translateY(-6px) scale(1.04);
}

/* COVER */
.cover {
  width: 100%;
  display: block;
}

/* TEXT */
.content {
  padding: 18px;
  font-family: "IBM Plex Mono", monospace;
}

.content h2 {
  margin: 0;
  font-size: 16px;
  letter-spacing: 2px;
}

</style>
</head>

<body>

<h1>FLOCK</h1>
<p class="subtitle">THE BIRDWATCHING MAGAZINE</p>

<div class="grid">

  <a class="issue" href="issues/issue-01/">

    <img class="cover" src="issues/issue-01/page-01.jpg">

    <div class="content">
      <h2>ISSUE 01</h2> <!-- FIXED (restored label) -->
    </div>

  </a>

</div>

</body>
</html>
