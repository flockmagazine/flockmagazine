<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FLOCK</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    /* =========================
       TITLE (DESKTOP FIXED)
    ========================== */

    h1 {
      text-align: center;
      margin: 0 auto 10px auto;
      font-size: 240px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Teko', sans-serif;
      line-height: 0.85;
      cursor: pointer;
      width: 100%;
      transition: transform 0.25s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      h1:hover {
        transform: scale(1.04);
      }
    }

    /* =========================
       SUBTITLE
    ========================== */

    .subtitle {
      text-align: center;
      color: #666;
      margin: 0 auto 50px auto;
      font-size: 28px;
      width: 100%;
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }

    /* =========================
       GRID
    ========================== */

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 520px;
      margin: auto;
    }

    /* =========================
       ISSUE CARD (DESKTOP BASE)
    ========================== */

    .issue {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);

      transition: transform 0.25s ease, box-shadow 0.25s ease;
      width: 100%;
    }

    @media (hover: hover) and (pointer: fine) {
      .issue:hover {
        transform: translateY(-6px) scale(1.03);
        box-shadow: 0 16px 40px rgba(0,0,0,0.18);
      }
    }

    .cover {
      width: 100%;
      height: auto;
      display: block;
    }

    .content {
      padding: 20px;
    }

    .content h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .content p {
      margin: 0;
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* =========================
       MOBILE FIX (CRITICAL)
    ========================== */

    @media (max-width: 600px) {

      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 22vw;
      }

      .subtitle {
        font-size: 5vw;
        max-width: 92vw;
        margin-bottom: 25px;
      }

      .grid {
        max-width: 100%;
      }

      /* 🔥 KEY FIX: card always fits screen */
      .issue {
        height: calc(100vh - 180px);
        display: flex;
        flex-direction: column;
      }

      .cover {
        flex: 1;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .content {
        flex-shrink: 0;
        padding: 14px;
      }

      .content h2 {
        font-size: 16px;
      }

      .content p {
        font-size: 13px;
      }
    }

  </style>
</head>

<body>

  <h1 id="title">FLOCK</h1>

  <p class="subtitle">
    THE BIRDWATCHING MAGAZINE
  </p>

  <div class="grid">

    <a class="issue" id="latest-issue" href="issues/issue-01/">

      <img
        class="cover"
        src="issues/issue-01/page-01.jpg"
        alt="FLOCK Issue 01 Cover"
      >

      <div class="content">

        <h2 id="issue-header">Issue 01</h2>

        <p>
          A Guide to Birdwatching in the UK
        </p>

      </div>

    </a>

  </div>

  <script>
    document.getElementById("title").addEventListener("click", () => {
      const el = document.getElementById("issue-header");

      if (el) {
        el.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    });
  </script>

</body>
</html>
