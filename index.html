<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>FLOCK</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f1ea;
  margin: 0;
  padding: 40px 20px;
  color: #222;
}

/* =========================
   TITLE
========================== */

h1 {
  text-align: center;
  margin: 0 auto 10px auto;
  font-size: 198px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-family: 'Teko', sans-serif;
  line-height: 0.85;
  width: 100%;
}

/* =========================
   SUBTITLE
========================== */

.subtitle {
  text-align: center;
  color: #666;
  margin: 0 auto 50px auto;
  font-size: 25px;
  font-family: 'IBM Plex Mono', monospace;
  text-transform: uppercase;
}

/* =========================
   GRID
========================== */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  max-width: 420px;
  margin: auto;
  gap: 20px;
}

/* =========================
   ISSUE CARD
========================== */

.issue {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  transform-origin: center;
}

.issue:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow: 0 18px 40px rgba(0,0,0,0.15);
}

.cover {
  width: 100%;
  display: block;
}

.content {
  padding: 20px;
}

.content h2 {
  margin: 0 0 10px;
  font-size: 18px;
  font-family: 'IBM Plex Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 3px;
}

.content p {
  margin: 0;
  color: #666;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
}

/* MOBILE */

@media (max-width: 600px) {

  h1 { font-size: 140px; }
  .subtitle { font-size: 18px; }

}

</style>
</head>

<body>

<h1>FLOCK</h1>

<p class="subtitle">THE BIRDWATCHING MAGAZINE</p>

<div class="grid">

  <a class="issue" href="issues/issue-01/">
    <img class="cover" src="flock-issue-01-may-2026-cover-page.jpg">
    <div class="content">
      <h2>Issue 01</h2>
      <p>A Guide to Birdwatching in the UK</p>
    </div>
  </a>

</div>

</body>
</html>
