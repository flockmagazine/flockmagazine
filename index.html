<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLOCK</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  padding: 40px 20px;
  background: #f4f1ea;
}

h1 {
  text-align: center;
  font-family: "Teko", sans-serif;
  font-size: 200px;
  margin: 0;
  line-height: 0.9;
}

/* MOBILE TITLE FIX (BIGGER) */
@media (max-width: 600px) {

  h1 {
    font-size: 36vw; /* 🔥 much larger, edge-to-edge feel */
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 20px;
  }

}

.subtitle {
  text-align: center;
  font-family: "IBM Plex Mono", monospace;
  font-size: 28px;
  margin: 10px auto 50px;
  color: #666;
}

.grid {
  display: flex;
  justify-content: center;
}

.issue {
  width: min(380px, 92vw);
  background: white;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.cover { width: 100%; display: block; }

.content {
  padding: 18px;
  font-family: "IBM Plex Mono", monospace;
}

.content h2 {
  margin: 0 0 6px;
  font-size: 16px;
}

.content p {
  margin: 0;
  font-size: 14px;
  color: #666;
}

</style>
</head>

<body>

<h1>FLOCK</h1>
<p class="subtitle">THE BIRDWATCHING MAGAZINE</p>

<div class="grid">

  <a class="issue" href="issues/issue-01/">
    <img class="cover" src="issues/issue-01/page-01.jpg">
    <div class="content">
      <h2>ISSUE 01</h2>
      <p>A Guide to Birdwatching in the UK</p>
    </div>
  </a>

</div>

</body>
</html>
